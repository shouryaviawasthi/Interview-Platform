<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h2>Simple Calculator</h2>

    <input type="text" id="display" readonly><br><br>

    <button onclick="addNumber('7')">7</button>
    <button onclick="addNumber('8')">8</button>
    <button onclick="addNumber('9')">9</button>
    <button onclick="addNumber('/')">/</button><br>

    <button onclick="addNumber('4')">4</button>
    <button onclick="addNumber('5')">5</button>
    <button onclick="addNumber('6')">6</button>
    <button onclick="addNumber('*')">*</button><br>

    <button onclick="addNumber('1')">1</button>
    <button onclick="addNumber('2')">2</button>
    <button onclick="addNumber('3')">3</button>
    <button onclick="addNumber('-')">-</button><br>

    <button onclick="addNumber('0')">0</button>
    <button onclick="calculate()">=</button>
    <button onclick="addNumber('+')">+</button>
    <button onclick="clearDisplay()">C</button>

    <script>
    function addNumber(value) {
        document.getElementById("display").value += value;
    }

    function calculate() {
        const display = document.getElementById("display");
        const expression = display.value;

        if (!/^(?:\d+(?:\.\d+)?[+\-*/])*\d+(?:\.\d+)?$/.test(expression)) {
            display.value = "Error";
            return;
        }

        const numbers = expression.split(/[+\-*/]/).map(Number);
        const operators = expression.match(/[+\-*/]/g) || [];

        for (let index = 0; index < operators.length; index += 1) {
            if (operators[index] === "*" || operators[index] === "/") {
                const right = numbers[index + 1];
                if (operators[index] === "/" && right === 0) {
                    display.value = "Error";
                    return;
                }
                numbers.splice(index, 2, operators[index] === "*" ? numbers[index] * right : numbers[index] / right);
                operators.splice(index, 1);
                index -= 1;
            }
        }

        display.value = operators.reduce(
            (result, operator, index) => operator === "+" ? result + numbers[index + 1] : result - numbers[index + 1],
            numbers[0]
        );
    }

    function clearDisplay() {
        document.getElementById("display").value = "";
    }
    </script>
</body>
</html>
